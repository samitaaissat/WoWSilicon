name: Wine Runtime

on:
  push:
    tags:
      - "runtime-v*"
  workflow_dispatch:
    inputs:
      build_number:
        description: "Runtime build number, for example 1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  runtime:
    runs-on: macos-15-intel

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          uname -m

      - name: Resolve build number
        id: build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            build_number="${{ inputs.build_number }}"
          else
            build_number="${GITHUB_REF_NAME#runtime-v}"
          fi
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "tag=runtime-v$build_number" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: brew install bison ccache gettext mingw-w64 pkgconfig freetype gnutls libpcap sdl2 molten-vk

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: wine-runtime-macos-15-intel
          max-size: 2G

      - name: Build runtime
        env:
          RUNTIME_BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
        run: bash tools/runtime/build-wine-runtime.sh

      # Upload the packaged runtime even when the smoke test fails, so it can
      # be validated on real Apple Silicon hardware (the runner is Intel-only).
      - name: Upload runtime artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wowsilicon-wine-${{ steps.build.outputs.build_number }}-osx64
          path: .build/wine-runtime/dist/
          retention-days: 7

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
        run: |
          set -euo pipefail
          dist=".build/wine-runtime/dist"
          tarball="$dist/wowsilicon-wine-$BUILD_NUMBER-osx64.tar.xz"
          checksum="$tarball.sha256"
          wine_commit="$(grep -m1 '^WINE_COMMIT=' tools/runtime/build-wine-runtime.sh | cut -d'"' -f2)"
          wine_branch="$(grep -m1 '^WINE_BRANCH=' tools/runtime/build-wine-runtime.sh | cut -d'"' -f2)"
          notes="Bundled Wine runtime build $BUILD_NUMBER, built from WineAndAqua/wine@$wine_commit (branch $wine_branch). Layout: wine/{bin,lib,share,VERSION}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$tarball" "$checksum" --clobber
            gh release edit "$TAG" --title "Wine runtime $BUILD_NUMBER" --notes "$notes"
          else
            gh release create "$TAG" "$tarball" "$checksum" \
              --title "Wine runtime $BUILD_NUMBER" \
              --notes "$notes"
          fi
